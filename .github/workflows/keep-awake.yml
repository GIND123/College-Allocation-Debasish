# Render's free plan puts the site to sleep after 15 idle minutes; the next visitor then waits
# while it starts again (and the free database starts empty). A visit every 10 minutes keeps it
# awake. /healthz touches neither the database nor the analytics.
name: Keep the site awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit rankround.com
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://rankround.com/healthz
